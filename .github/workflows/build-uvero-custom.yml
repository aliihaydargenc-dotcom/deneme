name: Build Customized Uvero

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-uvero-custom.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout customized source
        uses: actions/checkout@v4
        with:
          ref: uvero-base
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build for GitHub Pages
        run: npm run build -- --base /deneme/

      - name: Publish compiled site to uvero-live
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          touch .nojekyll
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b uvero-live
          git add -A
          git commit -m "deploy: customized Uvero toolbox"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin uvero-live
