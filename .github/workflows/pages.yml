name: Build and Publish Toolbox Web
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: toolbox-live
  cancel-in-progress: true
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack binary
        run: |
          curl -L https://github.com/wasm-bindgen/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/wasm-pack.tar.gz
          tar -xzf /tmp/wasm-pack.tar.gz -C /tmp
          sudo mv /tmp/wasm-pack-v0.15.0-x86_64-unknown-linux-musl/wasm-pack /usr/local/bin/wasm-pack
          wasm-pack --version
      - name: Build Rust/WASM core
        run: wasm-pack build rust-core --target web --out-dir ../wasm-pkg --release
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Test TypeScript fallback
        run: npm test
      - name: Build Vite app
        run: npm run build
      - name: Add WASM package to dist
        run: |
          cp -r wasm-pkg dist/wasm-pkg
          touch dist/.nojekyll
      - name: Publish compiled site to live branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "publish: live site from $GITHUB_SHA"
          git branch -M live
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin live
